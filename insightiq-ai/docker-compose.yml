version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: insightiq-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightiq_password}
      POSTGRES_DB: ${POSTGRES_DB:-insightiq_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightiq_user} -d ${POSTGRES_DB:-insightiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: insightiq-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-insightiq_user}:${POSTGRES_PASSWORD:-insightiq_password}@db:5432/${POSTGRES_DB:-insightiq_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "${APP_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: insightiq-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
